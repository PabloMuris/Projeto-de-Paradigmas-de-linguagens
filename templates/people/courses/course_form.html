{% extends "base.html" %}
{% block title %}{% if object %}Editar Curso{% else %}Novo Curso{% endif %}{% endblock %}

{% block content %}
<h1>{% if object %}Editar Curso{% else %}Novo Curso{% endif %}</h1>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Salvar</button>
</form>

<p><a href="{% url 'curso-list' %}">Cancelar e voltar</a></p>
{% endblock %}
