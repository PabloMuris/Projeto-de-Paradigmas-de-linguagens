{% extends "base.html" %}
{% block title %}{% if object %}Editar Aluno{% else %}Novo Aluno{% endif %}{% endblock %}

{% block content %}
<h1>{% if object %}Editar Aluno{% else %}Novo Aluno{% endif %}</h1>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Salvar</button>
</form>

<p><a href="{% url 'aluno-list' %}">Cancelar e voltar</a></p>
{% endblock %}
