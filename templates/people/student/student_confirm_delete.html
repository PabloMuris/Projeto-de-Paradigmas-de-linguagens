{% extends "base.html" %}
{% block title %}{{title}}{% endblock %}

{% block content %}
<h1>Excluir Aluno</h1>
<p>Tem certeza que deseja excluir o aluno "{{ object.nome }}"?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit">Confirmar Exclusão</button>
  <a href="{% url 'aluno-list' %}">Cancelar</a>
</form>
{% endblock %}
